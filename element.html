    <style>
     
 
    body {
        background-color: #2457a7;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

    }
    
    .container {
        background-color: white;
        padding: 40px;
        border-radius: 15px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        margin-top: 70px;
    }


    h1 {
        color: #1565C0;
        font-weight: bold;
        margin-bottom: 15px;
        }

    input {
        width: 98%;
        padding: 12px;
        border: 2px solid #2196F3;
        border-radius: 8px;
        margin: 15px 0;
        font-size: 18px;
    }

    button {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        background-color: #1565C0;
        color: white;
        border: none;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        margin: 15px 0;

    }

    button:hover {
        background-color: #0D47A1;
    }

    .result {
        background-color: #E3F2FD;
        padding: 20px;
        border-radius: 10px;
        margin-top: 25px;
        text-align: left;
    }

    .result h3 {
        text-align: center;
        color: #1565C0;
        margin-bottom: 20px;
    }

    footer {
           color: white;
           font-size: 13px;
           margin-top: auto;
           padding: 20px;
           text-align: center;
           background-color: rgba(23, 55, 101, 0.65);
           width: 100%;

       }

    nav {
        width: 100%;
        background-color: #2d5fa5;
        padding: 18px 35px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 30px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }


    nav a {
        text-decoration: none;
        color: white;
        font-size: 16px;
        font-weight: 600;
    }

    nav a:hover {
        color: #9fc8ff;
    }


    nav ul {
        list-style: none;
        margin: 0;
        padding: 10px;
    }

</style>

        <p>Enter the symbol of a non-metal element</p>
        <input type="text" id="element1" placeholder="Example: H"> <!-- text box -->
        <br>

        <button py-click="search_element">Search Element</button> <!-- button -->

        <div class="result"> <!-- results -->
            <h3><b>Search Results</b></h3>
            <p>Element Symbol: <span id="symbol"></span></p>
            <p>Element Name: <span id="name"></span></p>
            <p>Atomic Number: <span id="number"></span></p>
